<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found | Kazunari Shibata</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #f4f2ee;
      --text:     #2a2826;
      --text-dim: #2a2826;
      --accent:   #d4622a;
      --ease:     cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-synthesis: none;
      font-size: 1.375rem;
      line-height: 1.6;
      padding: 18vh 16vw;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 5rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 2.25rem;
      color: var(--text);
    }

    h1 .last {
      background: linear-gradient(352deg, rgba(220, 70, 10, 1) 0%, var(--text) 55%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      color: var(--text-dim);
    }

    a {
      color: var(--text-dim);
      text-decoration: underline;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 4px;
      text-decoration-color: color-mix(in srgb, var(--accent) 50%, transparent);
      transition:
        color                 0.3s var(--ease),
        text-decoration-color 0.3s var(--ease);
    }

    a:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    @media (max-width: 600px) {
      body {
        padding: 12vh 10vw;
        font-size: 1.25rem;
      }
      h1 {
        font-size: 4.25rem;
      }
    }
  </style>
